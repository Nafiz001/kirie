name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - run: dotnet restore
      - run: dotnet tool restore

      - name: Build
        run: dotnet build --no-restore -warnaserror

      - name: Check the migrations match the model
        run: dotnet ef migrations has-pending-model-changes --project Kirie.Api

      # The API and hub tests run the whole app, with synthetic weather and a
      # real SignalR client; nothing reaches the network.
      - name: Test
        run: dotnet test --no-build

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Check
        run: npm run check

      - name: Build
        run: npm run build
